name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gitwise
          POSTGRES_PASSWORD: gitwise
          POSTGRES_DB: gitwise
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gitwise -d gitwise"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      GITWISE_DATABASE_URL: postgresql+asyncpg://gitwise:gitwise@localhost:5432/gitwise
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Validate PostgreSQL migrations
        run: alembic upgrade head --sql > /tmp/gitwise-schema.sql
      - name: Apply PostgreSQL migrations
        run: alembic upgrade head
      - name: Run tests
        run: pytest
